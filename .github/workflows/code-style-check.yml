name: gkit-code-style-check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  clang-tidy:
    name: Clang-Tidy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-21 toolchain
        run: |
          echo "📦 Installing clang-21 toolchain..."
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-tidy-21
          sudo update-alternatives --install \
            /usr/bin/clang clang /usr/bin/clang-21 100
          sudo update-alternatives --install \
            /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
          sudo update-alternatives --install \
            /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-21 100
          echo "✅ $(clang-tidy --version | head -n1)"

      - name: Run clang-tidy
        run: |
          echo "🔍 Checking project sources (include/ src/ test/)..."
          FAILED=0
          SKIPPED=0
          CHECKED=0

          FILES=$(find include src test -type f \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) | sort)

          for file in $FILES; do
            CHECKED=$((CHECKED + 1))
            echo "  [$CHECKED] $file"

            result=$(clang-tidy "$file" -- \
              -I include -I src -std=c++20 2>&1) || true

            if echo "$result" | grep -q "fatal error:"; then
              echo "    ⏭ SKIPPED (missing third-party header)"
              SKIPPED=$((SKIPPED + 1))
            elif echo "$result" | grep -qE "(warning|error):"; then
              echo "$result"
              FAILED=1
            else
              echo "    ✅ OK"
            fi
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Files: $CHECKED checked | $SKIPPED skipped"
          if [ $FAILED -ne 0 ]; then
            echo "::error::clang-tidy found style issues"
            exit 1
          fi
          echo "✅ All checkable files pass"
